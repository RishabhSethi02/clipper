name: 24-7 Telegram Auto Clipper

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

# Only one bot instance at a time; a new run waits for the previous one to finish.
concurrency:
  group: telegram-clipper-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Deno (needed by yt-dlp for YouTube)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgl1 libglib2.0-0 fonts-noto-core

      - name: Cache Whisper models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-whisper-v1

      - name: Install Python packages (CPU-only torch first)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Install Autocrop-vertical + YOLOv8 weights
        run: |
          git clone --depth 1 https://github.com/kamilstanuch/Autocrop-vertical.git /tmp/Autocrop
          pip install -r /tmp/Autocrop/requirements.txt
          cd /tmp/Autocrop && python -c "from ultralytics import YOLO; YOLO('yolov8n.pt')"

      - name: Run the bot
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALLOWED_USERS: ${{ secrets.ALLOWED_USERS }}
          GH_PAT: ${{ secrets.GH_PAT }}
          BOT_CONFIG: ${{ vars.BOT_CONFIG }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_SECONDS: '19800'
          AUTOCROP_DIR: /tmp/Autocrop
        run: python bot_engine.py
